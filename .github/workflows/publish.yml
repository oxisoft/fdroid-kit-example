# F-Droid repo on GitHub Pages, published by fdroidkit.
#
# Layout of the repository that holds this workflow (see docs/github-pages.md):
#   fdroid/config.yml     keystore + passphrases read from env, repo_url = the Pages URL
#   fdroid/metadata/      one <package>.yml per app, signer pinned by `fdroidkit add-app`
#   fdroid/repo/icon.png  the repo icon (APKs are NOT committed: the action restores them
#                         from the live site before every publish)
#   fdroid/fdroidkit.json optional landing page brand
#
# Secrets: FDROID_KEYSTORE_B64 (base64 of the PKCS12 index key), FDROID_KEYSTORE_PASS.
# Settings > Pages > Source: GitHub Actions.
name: publish to F-Droid

on:
  workflow_dispatch:
    inputs:
      package: { description: Application id, required: true }
      source:
        description: "file = the APK at apk-url; github-release = the app's GitHub release (fdroid/fdroidkit.json)"
        type: choice
        options: [file, github-release]
        default: file
      version-code: { description: "versionCode (empty for github-release: read from the APK)", required: false }
      version-name: { description: "versionName (empty for github-release)", required: false }
      apk-url: { description: "URL of the signed APK (source file only)", required: false }
      tag: { description: "Release tag (github-release only, default the latest release)", required: false }

permissions:
  contents: write   # commit the bumped metadata back
  pages: write
  id-token: write

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the APK
        if: inputs.source == 'file'
        env:
          APK_URL: ${{ inputs.apk-url }}
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/in.apk" "$APK_URL"
      - uses: oxisoft/fdroid-kit/.github/actions/publish@v0.1.4
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          package: ${{ inputs.package }}
          version-code: ${{ inputs.version-code }}
          version-name: ${{ inputs.version-name }}
          source: ${{ inputs.source }}
          apk: ${{ inputs.source == 'file' && format('{0}/in.apk', runner.temp) || '' }}
          tag: ${{ inputs.tag }}
      - name: Commit the bumped metadata
        env:
          PKG: ${{ inputs.package }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          meta="fdroid/metadata/${PKG}.yml"
          name="$(sed -n 's/^CurrentVersion: *//p' "$meta")"
          code="$(sed -n 's/^CurrentVersionCode: *//p' "$meta")"
          git add fdroid/metadata
          git commit -m "F-Droid: ${PKG} ${name} (${code})" || exit 0
          git push

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet "fdroidkit[site] @ git+https://github.com/oxisoft/fdroid-kit@v0.1.4"
      - name: Live landing page matches the live index key
        run: |
          url="$(sed -n 's/^repo_url: *//p' fdroid/config.yml | tr -d "\"'")"
          site="${url%/fdroid/repo}"
          for i in 1 2 3 4 5 6; do
            curl -fsS "$url/index-v2.json" -o /dev/null && break
            sleep 10
          done
          mkdir -p "$RUNNER_TEMP/live"
          curl -fsS "$site/" -o "$RUNNER_TEMP/live/index.html"
          curl -fsS "$site/qr.svg" -o "$RUNNER_TEMP/live/qr.svg" || true
          fdroidkit --repo fdroid verify --site "$RUNNER_TEMP/live" --live "$url"
